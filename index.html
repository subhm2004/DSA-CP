<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C++ DSA & CP Library</title>
  <link rel="icon" href="site/favicon.svg" type="image/svg+xml" />
  <meta http-equiv="refresh" content="0; url=site/" />
  <script>location.replace('site/');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, sans-serif;
      color: #e2e8f0;
      background: #06080d;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.22), transparent),
        radial-gradient(ellipse 50% 30% at 100% 100%, rgba(245, 158, 11, 0.08), transparent);
    }
    .card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 420px;
    }
    .logo {
      width: 64px; height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
    }
    h1 {
      font-family: Outfit, Inter, sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5; }
    a {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #fff; text-decoration: none; font-weight: 600; font-size: 0.95rem;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(99, 102, 241, 0.45); }
    .hint { margin-top: 1.5rem; font-size: 0.75rem; color: #64748b; }
    code { background: #131a27; padding: 0.15rem 0.4rem; border-radius: 4px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="32" height="32" fill="none" stroke="#fff" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
      </svg>
    </div>
    <h1>C++ DSA & CP</h1>
    <p>Opening the library browser…</p>
    <a href="site/">Enter Library →</a>
    <p class="hint">Tip: open <code>/site/</code> directly — not the folder listing</p>
  </div>
</body>
</html>
